<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/stopwatch.png" />
    <link rel="apple-touch-icon" href="/stopwatch.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#dce8f4" />
    <meta name="description" content="Neumorphic stopwatch and countdown timer app" />
    <title>Stopwatch and Timer</title>
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: #dce8f4;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 32px;
        transition: opacity 0.55s ease, visibility 0.55s ease;
      }
      #splash.sp-hide {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .sp-face {
        width: 160px;
        height: 160px;
        border-radius: 50%;
        background: #dce8f4;
        box-shadow:
          inset 12px 12px 28px rgba(168, 193, 220, 0.75),
          inset -12px -12px 28px rgba(255, 255, 255, 0.95);
        display: flex;
        align-items: center;
        justify-content: center;
        animation: sp-pulse 2s ease-in-out infinite;
      }

      @keyframes sp-pulse {
        0%, 100% { box-shadow: inset 12px 12px 28px rgba(168,193,220,0.75), inset -12px -12px 28px rgba(255,255,255,0.95); }
        50%       { box-shadow: inset 8px 8px 20px rgba(168,193,220,0.55), inset -8px -8px 20px rgba(255,255,255,0.80); }
      }

      .sp-needle {
        transform-origin: 60px 64px;
        animation: sp-spin 1.6s cubic-bezier(0.4, 0.1, 0.6, 0.9) infinite;
      }
      @keyframes sp-spin { to { transform: rotate(360deg); } }

      .sp-text {
        text-align: center;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      .sp-title {
        font-size: 22px;
        font-weight: 700;
        color: #4d6480;
        letter-spacing: -0.3px;
        margin-bottom: 6px;
      }
      .sp-dots {
        display: flex;
        gap: 7px;
        justify-content: center;
        margin-top: 4px;
      }
      .sp-dots span {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #6b9fd4;
        opacity: 0.25;
        animation: sp-dot 1.2s ease-in-out infinite;
      }
      .sp-dots span:nth-child(2) { animation-delay: 0.2s; }
      .sp-dots span:nth-child(3) { animation-delay: 0.4s; }
      @keyframes sp-dot {
        0%, 80%, 100% { opacity: 0.25; transform: scale(0.85); }
        40%            { opacity: 1;    transform: scale(1.15); }
      }
    </style>
  </head>
  <body>
    <!-- Splash shown instantly before React loads -->
    <div id="splash">
      <div class="sp-face">
        <svg viewBox="0 0 120 128" width="120" height="128">
          <!-- Major ticks (12 positions) -->
          <line x1="60" y1="10" x2="60" y2="20"  stroke="#6b9fd4" stroke-opacity="0.45" stroke-width="2.5" stroke-linecap="round"/>
          <line x1="90" y1="17.4" x2="85" y2="26.1" stroke="#6b9fd4" stroke-opacity="0.45" stroke-width="2.5" stroke-linecap="round"/>
          <line x1="110.6" y1="40" x2="101.9" y2="45" stroke="#6b9fd4" stroke-opacity="0.45" stroke-width="2.5" stroke-linecap="round"/>
          <line x1="118" y1="68" x2="108" y2="68" stroke="#6b9fd4" stroke-opacity="0.45" stroke-width="2.5" stroke-linecap="round"/>
          <line x1="110.6" y1="96" x2="101.9" y2="91" stroke="#6b9fd4" stroke-opacity="0.45" stroke-width="2.5" stroke-linecap="round"/>
          <line x1="90" y1="118.6" x2="85" y2="109.9" stroke="#6b9fd4" stroke-opacity="0.45" stroke-width="2.5" stroke-linecap="round"/>
          <line x1="60" y1="126" x2="60" y2="116" stroke="#6b9fd4" stroke-opacity="0.45" stroke-width="2.5" stroke-linecap="round"/>
          <line x1="30" y1="118.6" x2="35" y2="109.9" stroke="#6b9fd4" stroke-opacity="0.45" stroke-width="2.5" stroke-linecap="round"/>
          <line x1="9.4" y1="96" x2="18.1" y2="91" stroke="#6b9fd4" stroke-opacity="0.45" stroke-width="2.5" stroke-linecap="round"/>
          <line x1="2" y1="68" x2="12" y2="68" stroke="#6b9fd4" stroke-opacity="0.45" stroke-width="2.5" stroke-linecap="round"/>
          <line x1="9.4" y1="40" x2="18.1" y2="45" stroke="#6b9fd4" stroke-opacity="0.45" stroke-width="2.5" stroke-linecap="round"/>
          <line x1="30" y1="17.4" x2="35" y2="26.1" stroke="#6b9fd4" stroke-opacity="0.45" stroke-width="2.5" stroke-linecap="round"/>

          <!-- Spinning needle -->
          <g class="sp-needle">
            <line x1="60" y1="66" x2="60" y2="24"
              stroke="rgba(255,255,255,0.9)" stroke-width="2.5" stroke-linecap="round"/>
            <line x1="60" y1="66" x2="60" y2="80"
              stroke="rgba(255,255,255,0.7)" stroke-width="4" stroke-linecap="round"/>
            <circle cx="60" cy="66" r="5.5"
              fill="#dce8f4" stroke="rgba(255,255,255,0.85)" stroke-width="2"/>
            <circle cx="60" cy="66" r="2.5" fill="rgba(107,159,212,0.8)"/>
          </g>
        </svg>
      </div>

      <div class="sp-text">
        <div class="sp-title">Stopwatch &amp; Timer</div>
        <div class="sp-dots">
          <span></span><span></span><span></span>
        </div>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
